name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - 'docker-composes/tatelestai/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - 'docker-composes/tatelestai/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-tests:
    name: Pint & Pest Tests (Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker-composes/tatelestai

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Preparar variables de entorno y permisos (.env)
        run: |
          cp .env.example .env
          cp ../../Backend/example-app/.env.example ../../Backend/example-app/.env
          # Sincronizar UID y GID con el usuario runner de GitHub Actions para evitar fallos de permisos
          sed -i "s/^UID=.*/UID=$(id -u)/" .env
          sed -i "s/^GID=.*/GID=$(id -g)/" .env
          # Desactivar compilación de Xdebug en CI para acelerar la construcción de la imagen
          sed -i 's/XDEBUG_ENABLED=true/XDEBUG_ENABLED=false/' .env
          # Asegurar permisos de escritura en directorios de caché y logs de Laravel
          chmod -R 777 ../../Backend/example-app/storage ../../Backend/example-app/bootstrap/cache

      - name: Iniciar servicios de Backend (PostgreSQL, Typesense, PHP-FPM)
        run: |
          docker compose up -d --build --wait postgres typesense php-fpm

      - name: Esperar inicialización de PHP-FPM y dependencias
        run: |
          echo "Esperando a que el entrypoint de php-fpm complete composer install y arranque..."
          timeout=180
          while [ ! -f "../../Backend/example-app/vendor/autoload.php" ] || [ -f "../../Backend/example-app/storage/.composer_installing" ]; do
            sleep 2
            timeout=$((timeout - 2))
            if [ $timeout -le 0 ]; then
              echo "Error: Tiempo de espera agotado esperando a que php-fpm inicialice Composer."
              docker compose logs php-fpm
              exit 1
            fi
          done
          echo "PHP-FPM y dependencias de Composer listas."

      - name: Generar App Key y preparar base de datos
        run: |
          docker compose exec -T php-fpm php artisan key:generate --force
          docker compose exec -T php-fpm php artisan migrate --force

      - name: Verificar estándar de código (Laravel Pint)
        run: |
          docker compose exec -T php-fpm ./vendor/bin/pint --test

      - name: Ejecutar suite de pruebas automatizadas (Pest PHP)
        run: |
          docker compose exec -T php-fpm php artisan test

      - name: Mostrar logs de contenedores en caso de fallo
        if: failure()
        run: |
          echo "=== Logs de PHP-FPM ==="
          docker compose logs php-fpm
          echo "=== Logs de PostgreSQL ==="
          docker compose logs postgres
          echo "=== Logs de Typesense ==="
          docker compose logs typesense

      - name: Limpiar contenedores y volúmenes
        if: always()
        run: |
          docker compose down -v
